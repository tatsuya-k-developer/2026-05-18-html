<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* span {
            color: red;
        } */

        h1 {
            color: red;
        }

        h1::after {
            content: "です";
            color: black;
        }

        h1::before {
            content: "これは";
            color: black;
        }


        
    </style>
</head>

<body>
    <h1 class="blue">H1タグ</h1>
    <div></div>
    <h2><span class="blue">これは</span>H2タグです</h2>

</body>

</html>
